[package]
name = "qf"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A fast, universal data format query tool"
license = "MIT"
repository = "https://github.com/pedrosanzmtz/qf"
homepage = "https://github.com/pedrosanzmtz/qf"
readme = "README.md"
keywords = ["jq", "yq", "json", "yaml", "cli"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
quick-xml = { version = "0.37", features = ["serialize"] }
toml = "0.8"
toml_edit = "0.22"
csv = "1.3"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
tempfile = "3.14"
regex = "1.10"
base64 = "0.22"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
